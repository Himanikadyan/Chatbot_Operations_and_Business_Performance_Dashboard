<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #f4f6f9; overflow: hidden; }

    /* Top Navigation Header */
    .navbar {
      height: 60px;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 1000;
      position: relative;
    }
    
    .brand-title {
      color: #ffffff;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      background: #3b82f6;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 12px;
      text-transform: uppercase;
    }

    /* Navigation Tabs */
    .tab-container {
      display: flex;
      gap: 8px;
      height: 100%;
      align-items: center;
    }

    .tab-button {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 40px;
    }

    .tab-button:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
    }

    .tab-button.active {
      background: #3b82f6;
      color: #ffffff;
      box-shadow: 0 2px 4px rgba(59, 130, 246, 0.4);
    }

    .external-btn {
      color: #94a3b8;
      text-decoration: none;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border: 1px solid #334155;
      border-radius: 4px;
      transition: 0.2s;
    }
    .external-btn:hover { background: #334155; color: #fff; }

    /* Content Area & Iframe */
    .viewport {
      height: calc(100vh - 60px);
      width: 100%;
      position: relative;
      background: #ffffff;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Loading Spinner */
    .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #64748b;
      font-size: 14px;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <div class="navbar">
    <div class="brand-title">
      Live Analytics <span class="brand-badge">Hub</span>
    </div>

    <div class="tab-container" id="tabsWrapper">
      <!-- Dynamic Tabs Will Render Here -->
    </div>

    <a id="openExternalLink" href="#" target="_blank" class="external-btn">
      <span>Open Direct</span> ↗
    </a>
  </div>

  <!-- Main Display Viewport -->
  <div class="viewport">
    <div class="loader" id="loadingState">
      <div class="spinner"></div>
      <div>Loading Dashboards...</div>
    </div>
    <iframe id="dashboardFrame" src="about:blank" style="display: none;" onload="hideLoader()"></iframe>
  </div>

  <script>
    let dashboardsList = [];

    window.onload = function() {
      google.script.run.withSuccessHandler(initDashboard).getDashboardLinks();
    };

    function initDashboard(dashboards) {
      dashboardsList = dashboards;
      const tabsWrapper = document.getElementById('tabsWrapper');
      tabsWrapper.innerHTML = '';

      if (!dashboards || dashboards.length === 0) {
        document.getElementById('loadingState').innerHTML = 'No dashboards found in sheet.';
        return;
      }

      dashboards.forEach((item, index) => {
        const btn = document.createElement('button');
        btn.className = `tab-button ${index === 0 ? 'active' : ''}`;
        btn.innerText = item.title;
        btn.onclick = function() { loadTab(index); };
        tabsWrapper.appendChild(btn);
      });

      // Load first dashboard by default
      loadTab(0);
    }

    function loadTab(index) {
      const item = dashboardsList[index];
      if (!item) return;

      // Update Active Tab Class
      const buttons = document.querySelectorAll('.tab-button');
      buttons.forEach((btn, idx) => {
        if (idx === index) btn.classList.add('active');
        else btn.classList.remove('active');
      });

      // Show Loader & Load URL inside Iframe
      document.getElementById('loadingState').style.display = 'block';
      const frame = document.getElementById('dashboardFrame');
      frame.style.display = 'none';
      frame.src = item.url;

      // Update Direct External Link
      document.getElementById('openExternalLink').href = item.url;
    }

    function hideLoader() {
      const frame = document.getElementById('dashboardFrame');
      if (frame.src !== 'about:blank') {
        document.getElementById('loadingState').style.display = 'none';
        frame.style.display = 'block';
      }
    }
  </script>
</body>
</html>
